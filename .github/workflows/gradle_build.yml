# This workflow ensures the building step works
#
# @author Armin Schnabel
# @version 1.0.0
# @since 1.0.0
name: Gradle Build

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
    branches:
      - main
      - 'release-*'

# Explicit workflow permissions (as little as required)
permissions:
  contents: read

# A new commit on a pull request stops the run of the previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Only for pushes (assumes protected branches) and for PRs from this repo (not from forks)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
        with:
          # Do not keep the token on the runner after the checkout, where build scripts and dependencies can read it
          persist-credentials: false

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew build
        env:
          USERNAME: ${{ github.actor }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
